[colors]
background = #1d1f21
background-alt = #131516
foreground = #666666
foreground-highlight = #cccccc
foreground-alt = #FF0134
foreground-alt2 = #333e30
primary = #F0C674
secondary = #6a9db3
secondary-2=  #557598
alert = #A54242
disabled = #666666
red = #DF4E4E
green = #32cf32
green2 = #54c682
green3 = #37ac76

[bar/main]
width = 100%
height = 26pt

offset-y = 0
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 5pt

;border-size = 4pt
;border-color = #00000000

padding-left = 0
padding-right = 0

module-margin = 1

separator-foreground = ${colors.disabled}

font-0 = "Px437ATISmallW6x8:size=10"
font-1 = HackNerdFont:size = 12
font-2 = "GohuFont11NerdFont:size = 12"
font-3 = "DS\-Digital:size=14:weight=bold"

separator = 
; %{T2}|

modules-left = i3work mpd
modules-right = wlan pulseaudio xkeyboard battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

tray-position = right
tray-padding = 0px
tray-background = ${colors.background}
tray-foreground = ${colors.foreground}


[module/i3work]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.foreground-alt}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-background = ${colors.background}
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %index%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

label-mode-underline = ${colors.red}
label-mode-foreground = ${colors.foreground-highlight}

[module/battery]
type= internal/battery

time-format = %H:%M
full-at = 100
low-at = 15

battery = BAT0
adapter = ADP1
poll-interval = 1


format-full = <label-full>
format-full-background = ${colors.green2}
format-full-foreground = ${colors.foreground-alt2}
format-full-padding = 1
format-full-underline = ${colors.green3}

format-charging = "<animation-charging>%{T4}<label-charging> "
format-charging-background = ${colors.green2}
format-charging-foreground = ${colors.foreground-alt2}
format-charging-underline = ${colors.green3}

format-discharging = "<ramp-capacity>%{T4}<label-discharging> "
format-discharging-padding = 0

label-full-font = 4
label-full = %percentage%%
label-discharging-font = 4
label-discharging = %{T4}%percentage%%

ramp-capacity-0 =
ramp-capacity-1 =
ramp-capacity-2 =
ramp-capacity-3 =
ramp-capacity-4 =


ramp-capacity-padding = 2

animation-charging-0 = " 󰢜 "
animation-charging-1 = " 󰂆 "
animation-charging-2 = " 󰂇 "
animation-charging-3 = " 󰂈 "
animation-charging-4 = " 󰢝 "
animation-charging-5 = " 󰂉 "
animation-charging-6 = " 󰢞 "
animation-charging-7 = " 󰂊 "
animation-charging-8 = " 󰂊 "
animation-charging-9 = " 󰂅 "

animation-charging-framerate = 500

format-low = %{T4}<label-low>
label-low = " !!%percentage%%!!"
label-low-font = 4
label-low-background = ${colors.red}
label-low-foreground = ${colors.background-alt}

[module/mpd]
type = internal/mpd

host = localhost
port = 6600
interval = 5

format-offline-foreground = ${colors.foreground-highlight}
format-online-foreground = ${colors.foreground-highlight}
format-offline = MPD disconnected !
format-online = %{T-} MPD Connected (Not playing anything)
format-playing = %{T-} Now playing: <icon-play> <label-song> 󰐊 <bar-progress> 
format-paused = %{T-}Paused: <label-song> 󰏤 <bar-progress> 

label-song =  %{T3} %title% by %artist%
label-song-font = 2
bar-progress-width = 20
bar-progress-indicator = 
bar-progress-fill = ▆
bar-progress-empty = -

icon-play = 󰐊

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

label-muted = 󰝟
label-muted-foreground = ${colors.red}

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %layout%
label-layout-foreground = ${colors.foreground-highlight}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}
label-indicator-underline = ${colors.secondary-2}

[module/wlan]
; Open NMTui
;click-left = exec alacritty 

type = internal/network
interface = wlo1
interval = 5
interface-type = wireless
format-connected = <ramp-signal> <label-connected>
format-disconnected =  <label-disconnected>
label-connected = OsakaOS at %essid% %local_ip%
label-disconnected = Not connected

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

[module/date]
type = internal/date
interval = 1

date = %d/%b/%Y %H:%M

label = %date%
label-foreground = ${colors.foreground-highlight}
label-font = 1

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
